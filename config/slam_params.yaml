# =============================================================================
# slam_toolbox - mapping configuration for the museum world
# =============================================================================
# Rubric item 4 requires the submitted map to be produced by slam_toolbox, so
# this is the config that generates your deliverable .pgm/.yaml.
#
# Workflow:
#   ros2 launch museum_security_robot slam.launch.py
#   ros2 run teleop_twist_keyboard teleop_twist_keyboard   (drive every room)
#   ros2 run nav2_map_server map_saver_cli -f ~/museum_map_slam
# =============================================================================
slam_toolbox:
  ros__parameters:
    use_sim_time: true

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    use_map_saver: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0        # was 5.0 - faster feedback while driving
    resolution: 0.05
    restamp_tf: false

    # FIXED: these must bracket the real sensor.  The old config declared a
    # 20 m max against a lidar that only reaches 12 m, which distorts how
    # free space is rastered into the map.
    min_laser_range: 0.15
    max_laser_range: 12.0

    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # A new scan is only added to the graph after this much motion.  Lowered
    # from 0.5 so tight rooms and doorways get denser coverage - the single
    # biggest quality win when your rooms are only ~8 m across.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.25
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 15
    scan_buffer_maximum_scan_distance: 12.0

    # Loop closure: when the robot revisits a place, these decide whether the
    # graph gets "snapped" back into alignment.  Getting a clean loop closure
    # after a full lap of the corridor is what removes accumulated drift.
    link_match_minimum_response_fine: 0.12
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 4.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
